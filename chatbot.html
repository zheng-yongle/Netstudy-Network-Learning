<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network AI Chatbot</title>
    <style>
        *{
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body{
            margin:0;
            padding:0;
        }
        header{
            background-color:#206bc4;
            color:white;
            text-align:center;
            padding:20px 10px;
        }
        nav{
            background:#fff;
            padding:12px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }
        nav a{
            margin:0 10px;
            color:#206bc4;
            text-decoration:none;
        }
        .container{
            max-width:900px;
            margin:30px auto;
            padding:0 20px;
        }
        .chat-box{
            border:1px solid #cccccc;
            min-height:350px;
            padding:15px;
            overflow-y:auto;
            margin-bottom:20px;
        }
        .msg-bot{
            background:#e9ecef;
            padding:8px 12px;
            border-radius:6px;
            max-width:70%;
            margin:6px 0;
        }
        .msg-user{
            background:#206bc4;
            color:white;
            padding:8px 12px;
            border-radius:6px;
            max-width:70%;
            margin:6px 0 6px auto;
            text-align:right;
        }
        .input-area{
            display:flex;
            gap:8px;
        }
        #question{
            flex:1;
            padding:10px;
            font-size:16px;
        }
        #sendBtn{
            padding:10px 22px;
            background:#206bc4;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
        }
    </style>
</head>
<body>
<header>
    <h1>Network AI Chatbot</h1>
    <p>Ask questions about computer networking</p >
</header>
<nav>
    <a href=" ">Home</a >
    <a href="#">Virtual Port Simulator</a >
    <a href="#">Subnet Calculator</a >
    <a href="#">Network AI Chatbot</a >
    <a href="#">Lab Quiz</a >
    <a href="#">Login / Register</a >
</nav>

<div class="container">
    <div class="chat-box" id="chatWindow">
        <div class="msg-bot">Hello! You can ask me questions about networking hardware, subnetting, RAID, BIOS, network devices and more.</div>
    </div>
    <div class="input-area">
        <input type="text" id="question" placeholder="Type your networking question here...">
        <button id="sendBtn">Send</button>
    </div>
</div>

<script>
const chatWindow = document.getElementById('chatWindow');
const inputBox = document.getElementById('question');
const sendBtn = document.getElementById('sendBtn');

//知识库：关键词匹配 + 标准答案
const knowledgeBase = [
    {
        keywords:["switch","交换机"],
        answer:"A switch works on Layer 2 (Data Link Layer). It uses MAC addresses to forward data inside the same local network."
    },
    {
        keywords:["router","路由器"],
        answer:"A router operates on Layer 3 (Network Layer). It uses IP addresses to connect different networks and route packets between subnets."
    },
    {
        keywords:["difference","switch router"],
        answer:"Switch: Layer2, MAC address, same LAN.\nRouter: Layer3, IP address, connect multiple networks."
    },
    {
        keywords:["bios","uefi","cmos"],
        answer:"BIOS/UEFI is firmware to initialize hardware. CMOS stores hardware configuration settings and requires a small battery to keep data."
    },
    {
        keywords:["raid 0"],
        answer:"RAID 0: Striping. Improve speed, NO redundancy. If one disk fails, all data lost."
    },
    {
        keywords:["raid 1"],
        answer:"RAID 1: Mirroring. Two disks copy identical data. Fault tolerance, half storage efficiency."
    },
    {
        keywords:["port scan","端口扫描"],
        answer:"Port scan detects open ports on a host. Administrators use it for security checking; attackers may use it to find vulnerabilities."
    },
    {
        keywords:["subnet","子网划分","ip address"],
        answer:"Subnetting divides a large network into smaller subnets. It reduces network traffic and improves network management."
    },
    {
        keywords:["printer","打印机"],
        answer:"A network printer can be shared in LAN. Multiple computers can send print jobs over the local network."
    },
    {
        keywords:["static ip","dhcp"],
        answer:"DHCP automatically assigns IP addresses to devices. Static IP is manually configured and will not change."
    }
];

const defaultReply = "Sorry, I have not learned this knowledge yet. Please try another question about computer networking."

//简易模糊匹配算法
function getAnswer(text){
    const lowerText = text.toLowerCase();
    for(let item of knowledgeBase){
        for(let word of item.keywords){
            if(lowerText.includes(word.toLowerCase())){
                return item.answer;
            }
        }
    }
    return defaultReply;
}

//页面渲染消息
function addMessage(text, isUser){
    const div = document.createElement('div');
    div.className = isUser ? "msg-user" : "msg-bot";
    div.innerText = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
}

//发送逻辑
function sendChat(){
    const text = inputBox.value.trim();
    if(!text) return;
    addMessage(text, true);
    inputBox.value = "";
    //模拟轻微延迟，更像AI
    setTimeout(()=>{
        const reply = getAnswer(text);
        addMessage(reply, false);
    }, 400);
}

sendBtn.onclick = sendChat;
inputBox.onkeydown = (e)=>{
    if(e.key === "Enter") sendChat();
}
</script>

</body>
</html>

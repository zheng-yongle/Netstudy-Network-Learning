<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network AI Chatbot | NetStudy</title>
    <script type="module">
        import { createWebLLM } from "https://cdn.jsdelivr.net/npm/@webllm/webllm@0.2.1/dist/webllm.min.js";
        window.llmEngine = await createWebLLM({
            model: "Llama-3-8B-Instruct-q4f32_1-MLC",
        });
        window.ready = true;
    </script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
        header{background:#1565C0;color:#fff;padding:20px;text-align:center;}
        nav{background:#EEEEEE;padding:16px;text-align:center;}
        nav a{margin:0 12px;text-decoration:none;color:#1565C0;font-weight:bold;}
        .container{width:90%;max-width:750px;margin:30px auto;}
        .chat-window{border:1px solid #ddd;border-radius:8px;padding:20px;height:420px;overflow-y:auto;margin-bottom:15px;background:#fafafa;}
        .user{text-align:right;margin:8px 0;}
        .bot{text-align:left;margin:8px 0;}
        .user span{background:#1565C0;color:white;padding:8px 12px;border-radius:6px;display:inline-block;max-width:75%;}
        .bot span{background:#e4e4e4;color:#222;padding:8px 12px;border-radius:6px;display:inline-block;max-width:75%;white-space:pre-wrap;}
        .input-area{display:flex;gap:8px;}
        #question{flex:1;padding:10px;font-size:15px;}
        button{background:#1565C0;color:white;border:none;padding:10px 20px;border-radius:4px;cursor:pointer;}
    </style>
</head>
<body>
    <header>
        <h1>Network AI Chatbot</h1>
        <p>Ask questions about computer networking</p >
    </header>
    <nav>
        <a href=" ">Home</a >
        <a href="port-sim.html">Virtual Port Simulator</a >
        <a href="calculator.html">Subnet Calculator</a >
        <a href="chatbot.html">Network AI Chatbot</a >
        <a href="lab-quiz.html">Lab Quiz</a >
        <a href="login.html">Login / Register</a >
    </nav>
    <div class="container">
        <div class="chat-window" id="chatBox">
            <div class="bot"><span>Loading local AI model, please wait. After downloading, you can ask me any computer network questions.</span></div>
        </div>
        <div class="input-area">
            <input id="question" placeholder="Type your networking question here...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

<script>
const chatBox = document.getElementById("chatBox");
const systemPrompt = "You are a professional computer networking tutor. Answer concisely, focus on IT Essential, subnetting, OSI model, network devices, ports, security. Reply in English.";

async function sendMessage(){
    let inputBox = document.getElementById("question");
    let text = inputBox.value.trim();
    if(text === "") return;

    chatBox.innerHTML += `<div class="user"><span>${text}</span></div>`;
    inputBox.value = "";
    chatBox.scrollTop = chatBox.scrollHeight;

    if(!window.ready){
        chatBox.innerHTML += `<div class="bot"><span>Model still loading, please wait a moment.</span></div>`;
        return;
    }

    let replyDiv = document.createElement("div");
    replyDiv.className="bot";
    let span = document.createElement("span");
    replyDiv.appendChild(span);
    chatBox.appendChild(replyDiv);

    const stream = await window.llmEngine.chat.completions.create({
        messages: [
            {role:"system", content:systemPrompt},
            {role:"user", content:text}
        ],
        stream:true
    });
    let fullText = "";
    for await (const chunk of stream){
        fullText += chunk.choices[0]?.delta?.content || "";
        span.innerText = fullText;
        chatBox.scrollTop = chatBox.scrollHeight;
    }
}
</script>
</body>
</html>
